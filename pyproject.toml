[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multimodal-swarm-lab"
version = "0.1.0"
description = "MuJoCo swarm flight, training, and learned dynamics laboratory"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<3", "mujoco>=3.3.7,<3.4", "gymnasium>=1.0,<2"]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.4,<3"]
test = ["pytest>=8,<9"]

[project.scripts]
swarm-lab = "swarm_lab.__main__:main"

[tool.setuptools.packages.find]
include = ["swarm_lab*"]

[tool.setuptools.package-data]
swarm_lab = ["web/*.html", "web/*.js", "web/*.css", "web/vendor/*", "web/assets/*", "models/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
