const settings={mode:1,v0:3,wmax:90,dpsi:30,tauV:0.8,dhold:5,kp:2.0,kd:2.4,amax:8,vmax:8,h:8,spacing:3,theta:35,acc:0.85,dec:1.0,lat:0.4,dead:12,vint:1.6,
  kg:3,drag:0.6,d0:4,Lmax:10,kt:4,ct:3,kpush:2.5,budget:0.1,lmax:6,eta:0.6,Rs:12,pcam:1.2,mass:1.2,twr:2.5,tauAtt:0.12,tiltMax:35,rlat:0.2,rloss:0.05};
const LAWS=[
  {title:'L0 · Formation physics',f:'mode 1 = elastic field (master pushed by goal, pulled by surprise, slaves on strings)\nmode 0 = rigid V (fixed slots, spring-damper)',text:'The elastic field is the design under test. The rigid V is the baseline formation.',params:[['mode','mode',0,1,1,'']]},

  {title:'L2e · Strings and slaves',f:'stretch = d − d₀ (0 inside d₀)\nF = k_t·stretch / (1 − (stretch/(L − d₀))²)  +  c_t·(v_rel·û)   on both ends\nd ≤ L always (hard string)\nslave: m·a = k_push·F_s(own position)  +  string  +  repulsion  −  c_d·v',text:'A string with slack: no force inside the rest length d₀, a soft spring beyond it, stiffening to a hard stop at L. It acts on both ends, so lagging slaves hold the master back. The slaves are pushed toward belief mass no camera covers.',params:[['d0','d₀',1,8,0.5,'m'],['Lmax','L',4,20,1,'m'],['kt','k_t',0.5,12,0.5,'1/s²'],['ct','c_t',0,8,0.5,'1/s'],['kpush','k_push',0,6,0.5,'m/s²']]},

  {title:'L2 · Followers (rigid V)',f:'slot_i = leader + R(ψ)·(±s, −s)\\na_i = k_p·(slot_i − p_i) + k_d·(v_leader − v_i) + Σ repulsion\\n|a| ≤ a_max,  |v| ≤ v_max',text:'A spring-damper pulls each follower to its slot in a V behind the leader, with the leader velocity fed forward. Repulsion keeps 2.2 m between drones.',params:[['spacing','s',2,6,0.5,'m'],['kp','k_p',0.5,5,0.1,''],['kd','k_d',0.5,5,0.1,''],['amax','a_max',2,15,0.5,'m/s²'],['vmax','v_max',3,12,0.5,'m/s']]},
  {title:'L3 · Altitude and camera',f:'ḧ = 4·(h* − h) − 4·ḣ\\nfootprint r = h·tan θ;  seen if ρ ≤ r, in the open',text:'All 3 fly at h*, above every tree and the roof. A person under a canopy or under the roof is invisible.',params:[['h','h*',5,14,0.5,'m'],['theta','θ',20,60,1,'°']]},

];
let simT=0;
let rngState=12345; function seed(n){ rngState=(n>>>0)||1; } function rng(){ rngState^=rngState<<13; rngState>>>=0; rngState^=rngState>>>17; rngState^=rngState<<5; rngState>>>=0; return rngState/4294967296; }
const metrics={cmds:0,wrong:0,none:0,seenT:0,totT:0,distSum:0,distN:0,lostEvents:0,surprise:0,stretchSum:0,stretchN:0,breaches:0,deterred:0};
const log=[]; let logVer=0;
function logLine(text,kind){ log.push({t:simT,text,kind:kind||'info'}); if(log.length>80)log.shift(); logVer++; }
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const dist2=(ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);
const wrapPi=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
const tanTheta=()=>Math.tan(settings.theta*Math.PI/180);

// ---------- terrain ----------
function hAt(x,z){
  for(const p of PLATFORMS)if(x>=p.x0&&x<=p.x1&&z>=p.z0&&z<=p.z1)return PLAT_H;
  for(const s of STAIRS){ if(x>=s.x0&&x<=s.x1&&z>=s.z0&&z<=s.z1){ const c=s.axis==='z'?z:x; return PLAT_H*(s.lo-c)/(s.lo-s.hi); } }
  return 0;
}
function insideB(x,z){ return x>BLD.x0&&x<BLD.x1&&z>BLD.z0&&z<BLD.z1; }
function underCanopy(x,z){ for(const t of TREES)if(dist2(x,z,t.x,t.z)<TREE_R)return true; return false; }
function wallBlocked(cx,cz,inf){
  for(const w of WALLS){
    if(w.side==='S'||w.side==='N'){ if(Math.abs(cz-w.z)<WALL_T/2+inf&&cx>w.x0-inf&&cx<w.x1+inf){ if(DOORS.some(d=>d.side===w.side&&Math.abs(cx-d.x)<d.w/2-inf))continue; return true; } }
    else{ if(Math.abs(cx-w.x)<WALL_T/2+inf&&cz>w.z0-inf&&cz<w.z1+inf){ if(DOORS.some(d=>d.side===w.side&&Math.abs(cz-d.z)<d.w/2-inf))continue; return true; } }
  }
  return false;
}
const inBox=(x,z,b,inf)=>x>b.x0-inf&&x<b.x1+inf&&z>b.z0-inf&&z<b.z1+inf;
const pgrid=new Uint8Array(GX*GZ); const hmap=new Float32Array(GX*GZ); const yardCells=[];
function cellOf(x,z){ return [clamp(Math.floor(x/CELL),0,GX-1),clamp(Math.floor(z/CELL),0,GZ-1)]; }
function buildGrids(){
  for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++){
    const cx=(i+0.5)*CELL, cz=(j+0.5)*CELL; const k=j*GX+i; hmap[k]=hAt(cx,cz);
    let b=cx<0.75||cx>W-0.75||cz<0.75||cz>H-0.75;
    if(!b)b=wallBlocked(cx,cz,0.45);
    if(!b)for(const r of racks){ if(inBox(cx,cz,r,0.45)){b=true;break;} }
    if(!b)for(const t of TREES){ if(dist2(cx,cz,t.x,t.z)<TRUNK_R+0.45){b=true;break;} }
    if(!b)for(const c of CONTAINERS){ if(inBox(cx,cz,c,0.45)){b=true;break;} }
    pgrid[k]=b?1:0;
    if(!b&&!insideB(cx,cz)&&cz>BLD.z1+1&&!underCanopy(cx,cz))yardCells.push({x:cx,z:cz});
  }
}
function astar(grid,sx,sz,gx,gz,useH,extra){
  const N=GX*GZ; const g=new Float32Array(N).fill(Infinity); const came=new Int32Array(N).fill(-1); const closed=new Uint8Array(N);
  const heap=[];
  const push=(f,i)=>{ heap.push([f,i]); let k=heap.length-1; while(k>0){ const p=(k-1)>>1; if(heap[p][0]<=heap[k][0])break; const t=heap[p];heap[p]=heap[k];heap[k]=t; k=p; } };
  const pop=()=>{ const top=heap[0]; const last=heap.pop(); if(heap.length){ heap[0]=last; let k=0; for(;;){ const l=2*k+1,r=l+1; let m=k; if(l<heap.length&&heap[l][0]<heap[m][0])m=l; if(r<heap.length&&heap[r][0]<heap[m][0])m=r; if(m===k)break; const t=heap[m];heap[m]=heap[k];heap[k]=t; k=m; } } return top; };
  const h=(i,j)=>{ const dx=Math.abs(i-gx),dz=Math.abs(j-gz); return Math.max(dx,dz)+0.414*Math.min(dx,dz); };
  const blocked=(i,j)=>grid[j*GX+i]===1||(extra&&!(i===gx&&j===gz)&&extra(i,j));
  const s=sz*GX+sx, goal=gz*GX+gx; if(grid[goal]===1)return null;
  g[s]=0; push(h(sx,sz),s); let exp=0;
  while(heap.length){
    const top=pop(); const cur=top[1]; if(closed[cur])continue; closed[cur]=1; if(cur===goal)break; if(++exp>40000)return null;
    const ci=cur%GX, cj=(cur-ci)/GX;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){
      if(!di&&!dj)continue; const ni=ci+di,nj=cj+dj; if(ni<0||nj<0||ni>=GX||nj>=GZ)continue;
      if(blocked(ni,nj))continue; if(di&&dj&&(blocked(ci+di,cj)||blocked(ci,cj+dj)))continue;
      const n=nj*GX+ni; if(closed[n])continue; if(useH&&Math.abs(hmap[n]-hmap[cur])>0.45)continue;
      const ng=g[cur]+((di&&dj)?1.414:1);
      if(ng<g[n]){ g[n]=ng; came[n]=cur; push(ng+h(ni,nj),n); }
    }
  }
  if(came[goal]<0&&goal!==s)return null;
  const cells=[]; let c=goal; while(c!==-1){ cells.push(c); c=came[c]; } cells.reverse();
  return cells.map(c=>{ const i=c%GX; return {x:(i+0.5)*CELL,z:((c-i)/GX+0.5)*CELL}; });
}
function los(grid,ax,az,bx,bz,useH){
  const L=Math.hypot(bx-ax,bz-az); const n=Math.max(1,Math.ceil(L/0.2)); let ph=useH?hAt(ax,az):0;
  for(let k=0;k<=n;k++){ const t=k/n; const x=ax+(bx-ax)*t,z=az+(bz-az)*t; const c=cellOf(x,z); if(grid[c[1]*GX+c[0]])return false; if(useH){ const hh=hAt(x,z); if(Math.abs(hh-ph)>0.35)return false; ph=hh; } }
  return true;
}
function simplify(grid,pts,useH){ if(!pts||pts.length<3)return pts; const out=[pts[0]]; let a=0; while(a<pts.length-1){ let b=pts.length-1; while(b>a+1&&!los(grid,pts[a].x,pts[a].z,pts[b].x,pts[b].z,useH))b--; out.push(pts[b]); a=b; } return out; }
function planPath(grid,from,to,extra,useH){
  const s=cellOf(from.x,from.z), g=cellOf(to.x,to.z);
  const cells=astar(grid,s[0],s[1],g[0],g[1],useH,extra||null); if(!cells)return null;
  let pts=simplify(grid,cells,useH);
  if(pts.length&&Math.hypot(pts[0].x-from.x,pts[0].z-from.z)<0.6)pts=pts.slice(1);
  pts.push({x:to.x,z:to.z}); return pts;
}
function planPathP(from,to){
  const s=cellOf(from.x,from.z), g=cellOf(to.x,to.z);
  const cells=astar(pgrid,s[0],s[1],g[0],g[1],true); if(!cells)return null;
  let pts=simplify(pgrid,cells,true);
  if(pts.length&&Math.hypot(pts[0].x-from.x,pts[0].z-from.z)<0.6)pts=pts.slice(1);
  pts.push({x:to.x,z:to.z}); return pts;
}
function pathLength(pts,from){ let L=0,px=from.x,pz=from.z; for(const p of pts){ L+=Math.hypot(p.x-px,p.z-pz); px=p.x;pz=p.z; } return L; }
function nearestFree(x,z,maxCells){
  x=clamp(x,0.9,W-0.9); z=clamp(z,0.9,H-0.9); const c=cellOf(x,z); if(!pgrid[c[1]*GX+c[0]])return {x,z};
  let best=null,bd=Infinity;
  for(let dj=-maxCells;dj<=maxCells;dj++)for(let di=-maxCells;di<=maxCells;di++){ const ni=c[0]+di,nj=c[1]+dj; if(ni<0||nj<0||ni>=GX||nj>=GZ||pgrid[nj*GX+ni])continue; const d=di*di+dj*dj; if(d<bd){bd=d;best={x:(ni+0.5)*CELL,z:(nj+0.5)*CELL};} }
  return best||{x,z};
}

// ---------- belief and surprise field ----------
const NB=[[1,0],[-1,0],[0,1],[0,-1]];
const wk=new Uint8Array(NC), insideCell=new Uint8Array(NC), canopyCell=new Uint8Array(NC); const cellX=new Float32Array(NC), cellZ=new Float32Array(NC); const NBR=[]; let NWALK=0;
function wallCross(ax,az,bx,bz){ for(let i=0;i<=10;i++){ const t=i/10; if(wallBlocked(ax+(bx-ax)*t,az+(bz-az)*t,0.05))return true; } return false; }
function buildBelief(){
  for(let c=0;c<NC;c++){ const cx=c%CX,cz=(c-cx)/CX; const x=(cx+0.5)*COV,z=(cz+0.5)*COV; cellX[c]=x; cellZ[c]=z;
    let ok=!wallBlocked(x,z,0.05); if(ok){ ok=false; for(let sj=0;sj<4&&!ok;sj++)for(let si=0;si<4&&!ok;si++){ if(!pgrid[(cz*4+sj)*GX+cx*4+si])ok=true; } }
    wk[c]=ok?1:0; if(ok)NWALK++; insideCell[c]=insideB(x,z)?1:0; canopyCell[c]=(!insideCell[c]&&underCanopy(x,z))?1:0; }
  for(let c=0;c<NC;c++){ const cx=c%CX,cz=(c-cx)/CX; const lst=[]; if(wk[c])for(const nb of NB){ const nx=cx+nb[0],nz=cz+nb[1]; if(nx<0||nz<0||nx>=CX||nz>=CZ)continue; const j=nz*CX+nx; if(!wk[j]||wallCross(cellX[c],cellZ[c],cellX[j],cellZ[j]))continue; lst.push(j); } NBR.push(lst); }
}
const P=new Float32Array(NC), S=new Float32Array(NC), scratch=new Float32Array(NC), covered=new Uint8Array(NC);
function normalizeP(){ let s=0; for(let k=0;k<NC;k++){ if(insideCell[k])P[k]=0; s+=P[k]; } if(!(s>1e-12)){ uniformP(); return; } for(let k=0;k<NC;k++)P[k]/=s; }
function uniformP(){ let n=0; for(let k=0;k<NC;k++)if(wk[k]&&!insideCell[k])n++; for(let k=0;k<NC;k++)P[k]=(wk[k]&&!insideCell[k])?1/n:0; }
function gaussianP(x,z,sig){ for(let k=0;k<NC;k++){ if(!wk[k]){P[k]=0;continue;} const d2=(cellX[k]-x)**2+(cellZ[k]-z)**2; P[k]=Math.exp(-d2/(2*sig*sig))+1e-6; } normalizeP(); }
function diffuseP(){ const k=clamp(settings.vint*0.5/COV*0.6,0.05,0.5); scratch.fill(0); for(let c=0;c<NC;c++){ if(!wk[c]||P[c]<=0)continue; const nb=NBR[c]; const p=P[c]; const kk=nb.length?k:0; scratch[c]+=p*(1-kk); for(const j of nb)scratch[j]+=p*kk/nb.length; } P.set(scratch); normalizeP(); }
const belief={seen:false,lastSeen:null,diffT:0.5,lambda:0,srate:0,checked:0,
  reset(){ uniformP(); this.seen=false; this.lastSeen=null; this.diffT=0.5; this.lambda=0; this.srate=0; this.checked=0; covered.fill(0); S.fill(0); },
  observe(drones,dt){
    covered.fill(0); let checked=0;
    for(const d of drones){ if(d.footR<=0)continue; const r=d.footR, x=d.x, z=d.z;
      const cx0=Math.max(0,Math.floor((x-r)/COV)),cx1=Math.min(CX-1,Math.floor((x+r)/COV)),cz0=Math.max(0,Math.floor((z-r)/COV)),cz1=Math.min(CZ-1,Math.floor((z+r)/COV));
      for(let cz=cz0;cz<=cz1;cz++)for(let cx=cx0;cx<=cx1;cx++){ const k=cz*CX+cx; if(!wk[k]||insideCell[k])continue; const rho=dist2(cellX[k],cellZ[k],x,z); if(rho>r)continue; covered[k]=1; const f=settings.pcam*(canopyCell[k]?0.15:1)*(1-rho/r)*dt; checked+=P[k]*f; P[k]*=(1-f); } }
    const seenNow=intruder.alive&&drones.some(d=>d.sees);
    if(seenNow){ checked=(!this.seen&&this.lastSeen&&simT-this.lastSeen.t>1.0)?1:0; gaussianP(intruder.x,intruder.z,1.5); this.lastSeen={x:intruder.x,z:intruder.z,t:simT}; }
    else{ normalizeP(); this.diffT-=dt; if(this.diffT<=0){ this.diffT=0.5; diffuseP(); } }
    this.seen=seenNow;

      for(const o of this.all()){ if(o===d)continue; const ox=d.x-o.x,oz=d.z-o.z; const od=Math.hypot(ox,oz); if(od<2.2&&od>1e-3&&Math.abs(o.y-d.y)<2){ const g=(2.2-od)*6; ax+=ox/od*g; az+=oz/od*g; } }
      accs.push([ax,ay,az]); });
    if(elastic){ L.stretch=0; this.followers.forEach((f,i)=>{ const dx=f.x-L.x,dz=f.z-L.z; const dd=Math.hypot(dx,dz)||1e-6; const ux=dx/dd,uz=dz/dd; const st=Math.max(0,dd-settings.d0); f.stretch=st; L.stretch=Math.max(L.stretch,st); if(st>0){ const span=Math.max(0.3,settings.Lmax-settings.d0); const q=clamp(st/span,0,0.97); const vrel=(f.vx-L.vx)*ux+(f.vz-L.vz)*uz; const F=settings.kt*st/(1-q*q)+settings.ct*Math.max(vrel,-50); accs[i+1][0]-=F*ux; accs[i+1][2]-=F*uz; accs[0][0]+=F*ux; accs[0][2]+=F*uz; } }); }
    const g=9.81, m=settings.mass, fmax=m*g*settings.twr/4, Tmax=4*fmax, tiltMax=settings.tiltMax*Math.PI/180;
    this.all().forEach((b,i)=>{ let [ax,ay,az]=accs[i]; const ah=Math.hypot(ax,az); if(ah>settings.amax){ ax*=settings.amax/ah; az*=settings.amax/ah; } ay=clamp(ay,-6,6);
      // required thrust vector and desired attitude
      let Fx=m*ax, Fy=m*(ay+g), Fz=m*az; let T=Math.hypot(Fx,Fy,Fz); if(T>Tmax){ Fx*=Tmax/T; Fy*=Tmax/T; Fz*=Tmax/T; T=Tmax; } if(T<0.05*Tmax)T=0.05*Tmax;
      const nx=Fx/T, ny=Math.max(0.05,Fy/T), nz=Fz/T;
      const sp=Math.hypot(b.vx,b.vz); if(sp>0.4)b.yaw=Math.atan2(b.vx,b.vz); const fx=Math.sin(b.yaw),fz=Math.cos(b.yaw), rx=Math.cos(b.yaw),rz=-Math.sin(b.yaw);
      const pitchDes=clamp(Math.atan2(nx*fx+nz*fz,ny),-tiltMax,tiltMax), rollDes=clamp(Math.atan2(-(nx*rx+nz*rz),ny),-tiltMax,tiltMax);
      const k=Math.min(1,dt/settings.tauAtt); const ePitch=pitchDes-b.pitch, eRoll=rollDes-b.roll; b.pitch+=ePitch*k; b.roll+=eRoll*k;
      // actual thrust direction from the real attitude
      const sx=Math.sin(b.pitch)*fx-Math.sin(b.roll)*rx, sz=Math.sin(b.pitch)*fz-Math.sin(b.roll)*rz, sy=Math.cos(b.pitch)*Math.cos(b.roll); const sn=Math.hypot(sx,sy,sz)||1;
      const aX=T/m*sx/sn, aY=T/m*sy/sn-g, aZ=T/m*sz/sn; b.T=T; b.acc={x:aX,y:aY,z:aZ};
      // mixer: FL, FR, RL, RR
      const tp=clamp(ePitch*1.2,-0.35,0.35)*fmax, tr=clamp(eRoll*1.2,-0.35,0.35)*fmax, ty=0; const base=T/4;
      b.rotors=[clamp((base+tp-tr+ty)/fmax,0,1),clamp((base+tp+tr-ty)/fmax,0,1),clamp((base-tp-tr-ty)/fmax,0,1),clamp((base-tp+tr+ty)/fmax,0,1)];
      b.vx+=aX*dt; b.vy+=aY*dt; b.vz+=aZ*dt; const v=Math.hypot(b.vx,b.vz); if(v>settings.vmax){ b.vx*=settings.vmax/v; b.vz*=settings.vmax/v; } b.vy=clamp(b.vy,-settings.vz*1.5,settings.vz*1.5);
      b.x=clamp(b.x+b.vx*dt,1,W-1); b.z=clamp(b.z+b.vz*dt,1,H-1); const ground=hAt(b.x,b.z)+0.2; b.y=b.y+b.vy*dt; if(b.y<ground){ b.y=ground; if(b.vy<0)b.vy=0; } });
    if(elastic){ for(const f of this.followers){ const dx=f.x-L.x,dz=f.z-L.z; const dd=Math.hypot(dx,dz); if(dd>settings.Lmax){ const ux=dx/dd,uz=dz/dd; f.x=L.x+ux*settings.Lmax; f.z=L.z+uz*settings.Lmax; const vr=(f.vx-L.vx)*ux+(f.vz-L.vz)*uz; if(vr>0){ f.vx-=vr*ux; f.vz-=vr*uz; } } } metrics.stretchSum+=L.stretch*dt; metrics.stretchN+=dt; }
    L.v=Math.hypot(L.vx,L.vz); const dI=dist2(L.x,L.z,intruder.x,intruder.z);
    for(const b of this.all()){ const h=b.y-hAt(b.x,b.z); b.footR=h>0.8?h*tanTheta():0; b.sees=intruder.alive&&b.footR>0&&intruder.visible>0&&dist2(b.x,b.z,intruder.x,intruder.z)<=b.footR; }
    const seenNow=this.all().some(b=>b.sees);
    if(seenNow){ intruder.lastSeen={x:intruder.x,z:intruder.z,t:simT}; if(!intruder.seen)logLine('Person in view ('+this.all().filter(b=>b.sees).map(b=>b.name).join(', ')+').','good'); }
    else if(intruder.seen){ metrics.lostEvents++; logLine('Person out of every footprint'+(intruder.visible?'':' (under cover)')+'.','warn'); }
    intruder.seen=seenNow; metrics.totT+=dt; if(intruder.alive){ if(seenNow)metrics.seenT+=dt; metrics.distSum+=dI*dt; metrics.distN+=dt; }
    belief.observe(this.all(),dt);
    // motor narration once per decision tick
    this.motorT=(this.motorT||0)-dt; if(this.motorT<=0){ this.motorT=mission.narrate==='tick'?0.5:2.0; say('motor',this.all().map(d=>(d===L?'M':d===this.followers[0]?'S1':'S2')+' T '+(100*d.T/(settings.mass*9.81)).toFixed(0)+'% tilt '+(Math.hypot(d.roll,d.pitch)*180/Math.PI).toFixed(0)+'° rotors '+d.rotors.map(r=>(100*r).toFixed(0)).join('/')+' v '+Math.hypot(d.vx,d.vy,d.vz).toFixed(1)).join(' · ')+(elastic?' · strings '+this.followers.map(f=>f.stretch.toFixed(1)).join('/')+' m':'')); }
  }
};

// ---------- brain link ----------
const brain={
  source:'keys',autopilot:false,queue:[],history:[],last:null,decT:0.5,replay:[],replayIdx:0,replayT0:0,liveState:'off',
  idealIntent(){ if(!intruder.alive||dist2(swarm.leader.x,swarm.leader.z,intruder.x,intruder.z)<2)return 'N'; const e=swarm.bearingErr()*180/Math.PI; const dead=settings.dead; return e>dead?'L':(e<-dead?'R':'N'); },
  issue(cmd,src){ this.queue.push({at:simT+settings.lat,cmd,intent:this.idealIntent(),src,issued:simT}); if(cmd!=='N')say('you',cmd==='L'?'Left.':'Right.'); },
  loadReplay(text){ const out=[]; for(const line of text.split(/\r?\n/)){ const m=line.trim().match(/^([0-9.]+)\s*[,;\t ]\s*([A-Za-z0-9]+)/); if(!m)continue; let c=m[2].toUpperCase()[0]; if(c==='0')c='N'; if(c==='1')c='L'; if(c==='2')c='R'; if('LRN'.indexOf(c)<0)continue; out.push({t:parseFloat(m[1]),cmd:c}); } out.sort((a,b)=>a.t-b.t); this.replay=out; this.replayIdx=0; this.replayT0=simT; logLine('Replay loaded: '+out.length+' decisions over '+(out.length?out[out.length-1].t.toFixed(1):0)+' s.','info'); return out.length; },
  step(dt){
    if(this.source==='sim'&&!this.autopilot){ this.decT-=dt; if(this.decT<=0){ this.decT=settings.dec; const intent=this.idealIntent(); let out=intent; if(rng()>settings.acc){ const others=['L','R','N'].filter(c=>c!==intent); out=others[Math.floor(rng()*others.length)]; } this.issue(out,'sim'); } }
    if(this.source==='replay'&&!this.autopilot){ while(this.replayIdx<this.replay.length&&this.replay[this.replayIdx].t<=simT-this.replayT0){ const e=this.replay[this.replayIdx++]; this.issue(e.cmd,'replay'); } }
    const due=[]; this.queue=this.queue.filter(q=>{ if(q.at<=simT){due.push(q);return false;} return true; });
    for(const q of due){ const correct=q.cmd===q.intent; if(!this.autopilot)swarm.command(q.cmd); this.history.push({t:simT,cmd:q.cmd,intent:q.intent,correct,src:q.src}); if(this.history.length>400)this.history.shift(); this.last={cmd:q.cmd,correct,t:simT,src:q.src,intent:q.intent};
      if(q.cmd==='N')metrics.none++; else { metrics.cmds++; if(!correct)metrics.wrong++; }
      if(q.cmd!=='N'||q.src==='keys')logLine((q.src==='keys'?'KEY ':q.src==='sim'?'BCI ':q.src==='replay'?'LOG ':'LIVE ')+q.cmd+(q.cmd==='N'?' (no turn)':' → leader turns '+(q.cmd==='L'?'left':'right')+' '+settings.dpsi+'°')+' · ideal was '+q.intent+(correct?'':' ✗'),correct?'cmd':'alert'); }
  }
};

const world={
  reset(){ simT=0; log.length=0; logVer++; talk.length=0; talkVer++; for(const k in metrics)metrics[k]=0; swarm.reset(); belief.reset(); intruder.reset(); brain.queue=[]; brain.history=[]; brain.last=null; brain.decT=0.5; brain.replayIdx=0; brain.replayT0=0; mission.lastPlan=null; logLine('Ready.','info'); say('you',GOALS[mission.goal]+'.'); },
  setGoal(g){ if(!GOALS[g])return; mission.goal=g; mission.orient=0; say('you',GOALS[g]+'.'); swarm.planT=0; },
  step(dt){ simT+=dt; intruder.step(dt,swarm.all()); brain.step(dt); swarm.step(dt,brain.autopilot); }
};
// budget sweep: autopilot + wandering person, same seconds per budget, returns in-view % per budget
function sweepRun(B,seedN,secs,useAutopilot){ intruder.mode='wander'; world.reset(); seed(seedN); brain.autopilot=useAutopilot; if(!useAutopilot)brain.source='sim'; mission.goal='track'; settings.budget=B; for(let i=0;i<secs*60;i++)world.step(1/60); return {B,cov:metrics.totT?metrics.seenT/metrics.totT:0,dist:metrics.distN?metrics.distSum/metrics.distN:0,lost:metrics.lostEvents}; }
function sweep(budgets,seeds,secs,useAutopilot){ const keep={autopilot:brain.autopilot,mode:intruder.mode,budget:settings.budget,source:brain.source,goal:mission.goal}; const out=[];
  for(const B of budgets){ let cov=0,dist=0,lost=0; for(const sd of seeds){ const r=sweepRun(B,sd,secs,useAutopilot); cov+=r.cov; dist+=r.dist; lost+=r.lost; } out.push({B,cov:cov/seeds.length,dist:dist/seeds.length,lost:lost/seeds.length}); }
  intruder.mode=keep.mode; mission.goal=keep.goal; world.reset(); brain.autopilot=keep.autopilot; settings.budget=keep.budget; brain.source=keep.source; return out; }
buildGrids(); buildBelief(); belief.reset();
if(typeof module!=='undefined')module.exports={world,simT:()=>simT,metrics,log,settings,swarm,brain,intruder,hAt,DOORS,belief,sweep,sweepRun,seed,P,S,talk,mission,GOALS};
