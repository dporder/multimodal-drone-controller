<script id="sim-core">
'use strict';
// [dan] Swarm Indoor: a 3-drone team (master + 2 followers) inside a building, driven by spoken orders, logging training data.
// Built in the style of Prat's Swarm Mind (simulators/swarm-mind): same seeded rng, master -> follower vectors over a lossy radio,
// talk lines ("Template: … Vectors M(…) · S1(…) · S2(…)"), and a DOM-free core that runs headless in node.
// Indoor additions: floor plans with rooms and doors, 2.5-D line of sight, room-level belief, the tactic library in
// docs/TACTICS.md, a deterministic safety validator with door locks, and one contract-v0 record per plan tick.

// ---------- settings (indoor safety envelope from docs/TACTICS.md) ----------
const settings={ceil:3.0,lintel:2.0,wallT:0.2,
  dS:2.5,dS2:3.0,dPress:1.5,floorPress:1.2,floorComfort:2.0,reflex:0.3,atDoor:4.0,pathAvoid:'comfort',doorGuard:true,escape:true,rPush:2.5,fearCap:3,sep:1.0,wallClr:0.4,zMin:1.2,zNom:1.6,zDoor:1.6,vMax:1.5,vSlow:0.5,aMax:2.0,
  camFov:90,camRange:8,chestH:1.3,hideH:1.0,walk:1.2,run:2.0,visitorWalk:0.9,
  rloss:0.05,rlat:0.2,linkTimeout:1.0,yawRate:120,spinRate:90,mass:0.45,twr:2.2,tiltMax:30,levelCov:{2:0.6,3:0.8,5:0.95},gateN:3,gateRange:9};
const SETTINGS0=JSON.parse(JSON.stringify(settings)); // reset() starts every episode from these, so settings never leak between episodes
let simT=0;
let rngState=12345, prngState=7; function seed(n){ let h=(n>>>0)^0x9e3779b9; h=Math.imul(h^(h>>>16),0x85ebca6b); h=Math.imul(h^(h>>>13),0xc2b2ae35); h^=h>>>16; rngState=(h>>>0)||1; prngState=(Math.imul(h^0x5bd1e995,0x27d4eb2d)>>>0)||7; } function rng(){ rngState^=rngState<<13; rngState>>>=0; rngState^=rngState>>>17; rngState^=rngState<<5; rngState>>>=0; return rngState/4294967296; } // seeds are mixed so small seeds still give varied layouts

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const hyp=Math.hypot;
const wrapPi=a=>{ while(a>Math.PI)a-=2*Math.PI; while(a<-Math.PI)a+=2*Math.PI; return a; };
const talk=[]; let talkVer=0; let speakHook=null;
function say(who,text){ talk.push({t:simT,who,text}); if(talk.length>200)talk.shift(); talkVer++; if(who==='you'&&typeof speakHook==='function')speakHook(text); }
const log=[]; let logVer=0;

const fmtV=v=>'('+(v.x>=0?'+':'')+v.x.toFixed(1)+', '+(v.y>=0?'+':'')+v.y.toFixed(1)+', '+(v.z>=0?'+':'')+v.z.toFixed(1)+')';

// ---------- floor plans ----------
// Frame: x to the east, z to the south, y up, metres. A 2 m strip of "outside" surrounds the building.
// Office family: north rooms (lab, office, kitchen), a corridor, south rooms (lobby, storage, meeting room), 3 exits.
// makeOffice(null) is the fixed reference floor; makeOffice(rng) randomizes sizes, door positions and widths, furniture, ceiling.
const CELL=0.1, NAV=0.2, MARGIN=2.0;
function makeOffice(r){

  const BW=r?Math.round(J(20,28)):24, BD=r?Math.round(J(13,16)):14, ceil=r?+J(2.7,3.6).toFixed(2):3.0;
  const cz0=M+(r?J(5.2,6.4):5.8), cz1=cz0+(r?J(2.2,2.8):2.4);
  const a=M+BW*J(0.30,0.38), b=M+BW*J(0.62,0.70), c=M+BW*J(0.26,0.33), d=M+BW*J(0.55,0.62);
  const rooms=[
    {name:'lab',x0:M,z0:M,x1:a,z1:cz0},{name:'office',x0:a,z0:M,x1:b,z1:cz0},{name:'kitchen',x0:b,z0:M,x1:M+BW,z1:cz0},
    {name:'corridor',x0:M,z0:cz0,x1:M+BW,z1:cz1},
    {name:'lobby',x0:M,z0:cz1,x1:c,z1:M+BD},{name:'storage',x0:c,z0:cz1,x1:d,z1:M+BD},{name:'meeting room',x0:d,z0:cz1,x1:M+BW,z1:M+BD}];
  rooms.forEach((q,i)=>{ q.id=i; q.cx=(q.x0+q.x1)/2; q.cz=(q.z0+q.z1)/2; });
  const OUT=rooms.length, R=n=>rooms.find(q=>q.name===n);
  const doors=[]; const add=(name,axis,x,z,w,ra,rb)=>doors.push({id:doors.length,name,axis,x:+x.toFixed(2),z:+z.toFixed(2),w:+w.toFixed(2),rooms:[ra,rb]});
  const onX=(q,w,lo,hi)=>clamp(q.x0+(q.x1-q.x0)*J(lo,hi),q.x0+0.8+w/2,q.x1-0.8-w/2);
  const onZ=(q,w,lo,hi)=>clamp(q.z0+(q.z1-q.z0)*J(lo,hi),q.z0+0.8+w/2,q.z1-0.8-w/2);
  let w;
  w=r?J(1.0,1.6):1.4; add('lab door','h',onX(R('lab'),w,0.55,0.8),cz0,w,R('lab').id,R('corridor').id);
  w=r?J(0.9,1.2):1.0; add('office door','h',onX(R('office'),w,0.3,0.7),cz0,w,R('office').id,R('corridor').id);
  w=r?J(0.9,1.2):1.0; add('kitchen door','h',onX(R('kitchen'),w,0.2,0.5),cz0,w,R('kitchen').id,R('corridor').id);
  w=0.9;              add('lab side door','v',a,onZ(R('lab'),w,0.3,0.6),w,R('lab').id,R('office').id);
  w=r?J(1.2,1.8):1.6; add('lobby door','h',onX(R('lobby'),w,0.4,0.7),cz1,w,R('lobby').id,R('corridor').id);
  w=r?J(0.9,1.2):1.0; add('storage door','h',onX(R('storage'),w,0.3,0.7),cz1,w,R('storage').id,R('corridor').id);
  w=r?J(0.9,1.2):1.0; add('meeting room door','h',onX(R('meeting room'),w,0.2,0.6),cz1,w,R('meeting room').id,R('corridor').id);
  w=r?J(1.4,1.8):1.6; add('main entrance','h',onX(R('lobby'),w,0.25,0.5),M+BD,w,R('lobby').id,OUT);
  w=1.2;              add('east exit','v',M+BW,(cz0+cz1)/2,Math.min(w,cz1-cz0-0.6),R('corridor').id,OUT);

  // furniture: [x0,z0,x1,z1,h,kind], kept clear of door approaches
  const furn=[]; const box=(x0,z0,x1,z1,h,kind)=>{ if(x1-x0<0.3||z1-z0<0.3)return; for(const dd of doors){ if(dd.x>x0-1.3&&dd.x<x1+1.3&&dd.z>z0-1.3&&dd.z<z1+1.3)return; } furn.push({x0,z0,x1,z1,h,kind}); };
  const lab=R('lab'), off=R('office'), kit=R('kitchen'), lob=R('lobby'), sto=R('storage'), mtg=R('meeting room');

  box(kit.x0+0.6,kit.z0+0.3,kit.x1-0.6,kit.z0+0.9,0.9,'counter'); box(kit.cx-0.8,kit.cz,kit.cx+0.8,kit.cz+0.9,0.75,'table');
  const rowL=sto.x0+1.5, rowR=sto.x1-1.5; box(rowL,sto.z0+1.6,rowR,sto.z0+2.1,2.2,'shelf'); if(sto.z1-sto.z0>5.2)box(rowL,sto.z0+3.4,rowR,sto.z0+3.9,2.2,'shelf'); // shelf rows leave end aisles wide enough for drones with 0.4 m wall clearance
  box(mtg.cx-(mtg.x1-mtg.x0)*0.25,mtg.cz-0.6,mtg.cx+(mtg.x1-mtg.x0)*0.25,mtg.cz+0.6,0.75,'table');
  box(lob.x1-2.6,lob.z0+0.9,lob.x1-0.9,lob.z0+1.6,1.1,'desk');
  const pads=[0,1,2].map(k=>({x:lob.cx-1+k,z:lob.cz+0.6}));
  return {family:'office',W:BW+2*M,D:BD+2*M,BW,BD,ceil,rooms,doors,furn,OUT,home:lob.id,pads,operator:{x:lob.cx,z:lob.cz+1.5}};

// ---------- grids derived from the plan (one representation; everything else reads these) ----------
let plan=null, GX=0, GZ=0, NX=0, NZ=0;
let Hg, DOORC, ROOMC;            // 0.1 m: obstacle top height, door id+1, room id (-1 wall/door, OUT outside)
let WALK, FLY, FLYRAW, ROOMN, DZONE; // 0.2 m: walk blocked, fly blocked (inflated, door channels carved), raw fly obstacles, room id, door zone id+1
let roomDist=null;              // room-to-room distance via doors (m)
let CLR=null;                    // 0.1 m: distance (m) to the nearest obstacle at drone flight height (top >= 1.1 m), chamfer transform
const COVP=[];                   // coverage points per room: {x,z,seen}
function buildWorld(p){
  plan=p; settings.ceil=p.ceil; const wt=settings.wallT, M=MARGIN, ceil=p.ceil; for(const k in doorFields)delete doorFields[k];
  GX=Math.ceil(p.W/CELL); GZ=Math.ceil(p.D/CELL); NX=Math.ceil(p.W/NAV); NZ=Math.ceil(p.D/NAV);
  Hg=new Float32Array(GX*GZ); DOORC=new Int16Array(GX*GZ); ROOMC=new Int16Array(GX*GZ).fill(p.OUT);
  for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++){ const x=(i+0.5)*CELL, z=(j+0.5)*CELL, k=j*GX+i;
    if(x>M-wt/2&&x<M+p.BW+wt/2&&z>M-wt/2&&z<M+p.BD+wt/2){ Hg[k]=ceil; ROOMC[k]=-1; }
    for(const q of p.rooms){ if(x>q.x0+wt/2&&x<q.x1-wt/2&&z>q.z0+wt/2&&z<q.z1-wt/2){ Hg[k]=0; ROOMC[k]=q.id; break; } }
    for(const d of p.doors){ const inDoor=d.axis==='h'?(Math.abs(z-d.z)<=wt/2+0.06&&Math.abs(x-d.x)<=d.w/2):(Math.abs(x-d.x)<=wt/2+0.06&&Math.abs(z-d.z)<=d.w/2); if(inDoor){ Hg[k]=0; DOORC[k]=d.id+1; ROOMC[k]=-1; } }
    for(const f of p.furn){ if(x>f.x0&&x<f.x1&&z>f.z0&&z<f.z1)Hg[k]=Math.max(Hg[k],f.h); } }
  const N=NX*NZ, walkRaw=new Uint8Array(N); FLYRAW=new Uint8Array(N); ROOMN=new Int16Array(N); DZONE=new Int16Array(N);
  for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){ const k=j*NX+i; let hw=0;
    for(let dj=0;dj<2;dj++)for(let di=0;di<2;di++){ const ii=Math.min(GX-1,2*i+di), jj=Math.min(GZ-1,2*j+dj); hw=Math.max(hw,Hg[jj*GX+ii]); }
    walkRaw[k]=hw>0.3?1:0; FLYRAW[k]=hw>1.0?1:0;
    const x=(i+0.5)*NAV, z=(j+0.5)*NAV; ROOMN[k]=ROOMC[cellIdx(x,z)];
    if(i===0||j===0||i===NX-1||j===NZ-1){ walkRaw[k]=1; FLYRAW[k]=1; } }

  for(const d of p.doors){ const halfT=Math.max(d.w/2-0.3,NAV*0.55);
    for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){ const x=(i+0.5)*NAV, z=(j+0.5)*NAV; const {n,t}=doorCoords(d,x,z); const k=j*NX+i;
      if(Math.abs(t)<=halfT&&Math.abs(n)<=1.2&&!FLYRAW[k])FLY[k]=0;
      if(Math.abs(t)<=d.w/2+0.2&&Math.abs(n)<=0.8)DZONE[k]=d.id+1; } }
  // room graph distances (room centre -> door -> room centre), Floyd–Warshall on a handful of rooms
  const nR=p.rooms.length+1; roomDist=Array.from({length:nR},(_,i)=>Array.from({length:nR},(_,j)=>i===j?0:Infinity));
  const ctr=i=>i<p.rooms.length?{x:p.rooms[i].cx,z:p.rooms[i].cz}:null;
  for(const d of p.doors){ const [a,b]=d.rooms; const ca=ctr(a), cb=ctr(b); const L=(ca?hyp(ca.x-d.x,ca.z-d.z):2)+(cb?hyp(cb.x-d.x,cb.z-d.z):2); roomDist[a][b]=Math.min(roomDist[a][b],L); roomDist[b][a]=roomDist[a][b]; }
  for(let k=0;k<nR;k++)for(let i=0;i<nR;i++)for(let j=0;j<nR;j++)if(roomDist[i][k]+roomDist[k][j]<roomDist[i][j])roomDist[i][j]=roomDist[i][k]+roomDist[k][j];
  CLR=new Float32Array(GX*GZ); for(let k=0;k<GX*GZ;k++)CLR[k]=Hg[k]>=1.1?0:1e9;
  const a=CELL, b=CELL*Math.SQRT2;
  for(let j=0;j<GZ;j++)for(let i=0;i<GX;i++){ const k=j*GX+i; let v=CLR[k]; if(i>0)v=Math.min(v,CLR[k-1]+a); if(j>0){ v=Math.min(v,CLR[k-GX]+a); if(i>0)v=Math.min(v,CLR[k-GX-1]+b); if(i<GX-1)v=Math.min(v,CLR[k-GX+1]+b); } CLR[k]=v; }
  for(let j=GZ-1;j>=0;j--)for(let i=GX-1;i>=0;i--){ const k=j*GX+i; let v=CLR[k]; if(i<GX-1)v=Math.min(v,CLR[k+1]+a); if(j<GZ-1){ v=Math.min(v,CLR[k+GX]+a); if(i<GX-1)v=Math.min(v,CLR[k+GX+1]+b); if(i>0)v=Math.min(v,CLR[k+GX-1]+b); } CLR[k]=v; }

  COVP.length=0; for(const q of p.rooms){ const pts=[]; for(let z=q.z0+0.45;z<q.z1-0.3;z+=0.5)for(let x=q.x0+0.45;x<q.x1-0.3;x+=0.5){ if(Hg[cellIdx(x,z)]<0.3&&!WALK[navIdx(x,z)])pts.push({x,z,seen:0}); } COVP.push(pts); }
}
function dilate(src,r){ const out=new Uint8Array(src.length); for(let j=0;j<NZ;j++)for(let i=0;i<NX;i++){ if(!src[j*NX+i])continue; for(let dj=-r;dj<=r;dj++)for(let di=-r;di<=r;di++){ if(di*di+dj*dj>r*r+r)continue; const ii=i+di, jj=j+dj; if(ii>=0&&jj>=0&&ii<NX&&jj<NZ)out[jj*NX+ii]=1; } } return out; }
function cellIdx(x,z){ return clamp(Math.floor(z/CELL),0,GZ-1)*GX+clamp(Math.floor(x/CELL),0,GX-1); }
function navIdx(x,z){ return clamp(Math.floor(z/NAV),0,NZ-1)*NX+clamp(Math.floor(x/NAV),0,NX-1); }
function navXZ(k){ const i=k%NX; return {x:(i+0.5)*NAV,z:((k-i)/NX+0.5)*NAV}; }
function heightAt(x,z){ return Hg[cellIdx(x,z)]; }
function roomAt(x,z){ return ROOMC[cellIdx(x,z)]; }
function doorCoords(d,x,z){ return d.axis==='h'?{n:z-d.z,t:x-d.x}:{n:x-d.x,t:z-d.z}; }
// unit normal of a door pointing out of room `rid` (into the other side)
function doorNormal(d,rid){ const q=plan.rooms[rid]; if(!q){ const o=plan.rooms[d.rooms[0]]; const n=doorNormal(d,o.id); return {x:-n.x,z:-n.z}; }
  return d.axis==='h'?{x:0,z:Math.sign(d.z-q.cz)||1}:{x:Math.sign(d.x-q.cx)||1,z:0}; }
function doorTangent(d){ return d.axis==='h'?{x:1,z:0}:{x:0,z:1}; }

// ---------- geometry: 2.5-D line of sight, paths ----------
// A ray is blocked by any cell whose obstacle top is above the ray there, and by a door's lintel above settings.lintel.
function los(ax,ay,az,bx,by,bz){
  const L=hyp(bx-ax,bz-az); const n=Math.max(1,Math.ceil(L/0.05));
  for(let k=1;k<n;k++){ const t=k/n; if(t*L<0.12||(1-t)*L<0.12)continue; const x=ax+(bx-ax)*t, z=az+(bz-az)*t, y=ay+(by-ay)*t; const c=cellIdx(x,z);
    if(Hg[c]>=y)return false; if(DOORC[c]&&y>settings.lintel)return false; }
  return true;
}
function losGrid(grid,ax,az,bx,bz){ const L=hyp(bx-ax,bz-az); const n=Math.max(1,Math.ceil(L/0.1)); for(let k=0;k<=n;k++){ const t=k/n; if(grid[navIdx(ax+(bx-ax)*t,az+(bz-az)*t)])return false; } return true; }
function astar(grid,sx,sz,gx,gz,extra){
  const N=NX*NZ; const g=new Float32Array(N).fill(Infinity); const came=new Int32Array(N).fill(-1); const closed=new Uint8Array(N); const heap=[];
  const push=(f,i)=>{ heap.push([f,i]); let k=heap.length-1; while(k>0){ const p=(k-1)>>1; if(heap[p][0]<=heap[k][0])break; const t=heap[p];heap[p]=heap[k];heap[k]=t; k=p; } };
  const pop=()=>{ const top=heap[0]; const last=heap.pop(); if(heap.length){ heap[0]=last; let k=0; for(;;){ const l=2*k+1,r=l+1; let m=k; if(l<heap.length&&heap[l][0]<heap[m][0])m=l; if(r<heap.length&&heap[r][0]<heap[m][0])m=r; if(m===k)break; const t=heap[m];heap[m]=heap[k];heap[k]=t; k=m; } } return top; };
  const h=(i,j)=>{ const dx=Math.abs(i-gx),dz=Math.abs(j-gz); return Math.max(dx,dz)+0.414*Math.min(dx,dz); };
  const blocked=(i,j)=>grid[j*NX+i]===1||(extra&&!(i===gx&&j===gz)&&extra(i,j));
  const s=sz*NX+sx, goal=gz*NX+gx; if(grid[goal]===1)return null;
  g[s]=0; push(h(sx,sz),s); let exp=0;
  while(heap.length){ const cur=pop()[1]; if(closed[cur])continue; closed[cur]=1; if(cur===goal)break; if(++exp>60000)return null;
    const ci=cur%NX, cj=(cur-ci)/NX;
    for(let dj=-1;dj<=1;dj++)for(let di=-1;di<=1;di++){ if(!di&&!dj)continue; const ni=ci+di,nj=cj+dj; if(ni<0||nj<0||ni>=NX||nj>=NZ)continue;
      if(blocked(ni,nj))continue; if(di&&dj&&(blocked(ci+di,cj)||blocked(ci,cj+dj)))continue;
      const nn=nj*NX+ni; if(closed[nn])continue; const ng=g[cur]+((di&&dj)?1.414:1); if(ng<g[nn]){ g[nn]=ng; came[nn]=cur; push(ng+h(ni,nj),nn); } } }

  const cells=[]; let c=goal; while(c!==-1){ cells.push(c); c=came[c]; } cells.reverse(); return cells.map(navXZ);
}
function shortcut(grid,pts){ if(!pts||pts.length<3)return pts; const out=[pts[0]]; let a=0; while(a<pts.length-1){ let b=pts.length-1; while(b>a+1&&!losGrid(grid,pts[a].x,pts[a].z,pts[b].x,pts[b].z))b--; out.push(pts[b]); a=b; } return out; }
// nearest unblocked nav cell to (x,z) within maxM metres (breadth-first over cells)
function nearestFreeNav(grid,x,z,maxM){ const k0=navIdx(x,z); if(!grid[k0])return {x,z}; const i0=k0%NX, j0=(k0-i0)/NX, R=Math.ceil((maxM||3)/NAV); let best=null,bd=Infinity;
  for(let dj=-R;dj<=R;dj++)for(let di=-R;di<=R;di++){ const i=i0+di,j=j0+dj; if(i<0||j<0||i>=NX||j>=NZ||grid[j*NX+i])continue; const d=di*di+dj*dj; if(d<bd){ bd=d; best={x:(i+0.5)*NAV,z:(j+0.5)*NAV}; } } return best; }
function planPath(grid,from,to,extra){
  const f=nearestFreeNav(grid,from.x,from.z,2)||from, t=nearestFreeNav(grid,to.x,to.z,3); if(!t)return null;
  const s=navIdx(f.x,f.z), g=navIdx(t.x,t.z); const si=s%NX, gi=g%NX;
  const cells=astar(grid,si,(s-si)/NX,gi,(g-gi)/NX,extra); if(!cells)return null;
  let pts=shortcut(grid,cells); if(pts.length&&hyp(pts[0].x-from.x,pts[0].z-from.z)<0.3)pts=pts.slice(1);

      label:{template:out.key,text:out.text,band:mission.band,door:out.door!=null?out.door:null,room:out.room!=null?out.room:null,exit:out.exit!=null?out.exit:null,
        slots:team.drones.map(d=>r3(d.slot)),vectors:team.drones.map(d=>r3(d.vec)),yaw:team.drones.map(d=>d.yawCmd==null?null:+d.yawCmd.toFixed(3)),spin:team.drones.map(d=>!!d.spinCmd),refs,flags:team.drones.map(d=>d.flags.slice())},

  const changed=!mission.lastSay||mission.lastSay.key!==out.key||mission.lastSay.text!==out.text||mission.lastSay.band!==mission.band||simT-mission.lastSay.t>(mission.narrate==='tick'?0:4);
  if(changed){ mission.lastSay={key:out.key,text:out.text,band:mission.band,t:simT}; say('master',(team.seen?'':I?'Last seen '+(simT-team.lkpT).toFixed(1)+' s ago. ':'Person unseen. ')+'Template: '+out.text+'. Vectors '+team.drones.map(d=>d.id+fmtV(d.vec)+' '+hyp(d.vec.x,d.vec.y,d.vec.z).toFixed(1)+' m').join(' · ')+' · radio → S1, S2'+(mission.band==='pressure'?' · pressure band: '+settings.dPress+' m':'')); }
}
function truth(dt){ const air=team.drones.filter(d=>d.y>0.5);
  if(person.alive)for(const d of air){ const s=hyp(d.x-person.x,d.z-person.z); if(s<4&&los(d.x,d.y,d.z,person.x,1.3,person.z)){ if(s<metrics.minStandoff)metrics.minStandoff=s; const b=droneBand(d), lim=b==='pressure'?settings.floorPress:settings.floorComfort;
      if(b==='pressure'){ metrics.bandT.pressure+=dt; if(s<metrics.minPressure)metrics.minPressure=s; } else { metrics.bandT.comfort+=dt; if(s<metrics.minComfort)metrics.minComfort=s; }
      if(s<settings.floorPress)metrics.floorViol+=dt;
      if(s<lim){ metrics.standoffViol+=dt; metrics.bandViol[b]+=dt; if((d.vx*(person.x-d.x)+d.vz*(person.z-d.z))/Math.max(s,1e-3)>0.1)metrics.standoffApproach+=dt; } } }
  for(let a=0;a<air.length;a++)for(let b=a+1;b<air.length;b++){ const s=hyp(air[a].x-air[b].x,air[a].z-air[b].z); if(s<metrics.minSep)metrics.minSep=s; if(s<0.6)metrics.sepViol+=dt; }
  for(const d of air){ if(d.y<settings.zMin-0.3)continue; const w=wallClearance(d); if(w<metrics.minWall)metrics.minWall=w; if(w<0.25)metrics.wallViol+=dt; if(d.y>settings.ceil-0.45)metrics.altViol+=dt; } }

const world={endOnGone:false,ended:false,scenario:null,
  // reset(opts): {layout:'fixed'|'random', protect:'lab', person:{role,intent,start,targetRoom,startExit,params}, goal, params, settings, endOnGone}. Call seed(n) first.
  reset(opts){ opts=opts||{}; Object.assign(settings,JSON.parse(JSON.stringify(SETTINGS0)),opts.settings||{});
    buildWorld(opts.layout==='random'?makeOffice(rng):makeOffice(null));
    simT=0; talk.length=0; talkVer++; log.length=0; logVer++; radio.length=0; for(const k in doorLock)delete doorLock[k];
    for(const k in metrics)metrics[k]=k.startsWith('min')?Infinity:(k==='tFound'?null:k==='bandViol'||k==='bandT'?{pressure:0,comfort:0}:0);
    const protect=roomByName(opts.protect)!=null?roomByName(opts.protect):plan.rooms.find(q=>q.name==='lab').id;

    team.drones=plan.pads.map((p,k)=>makeDrone(k,p)); Object.assign(team,{seen:false,lkp:null,lkpT:-1,lkpRoom:-1,vel:{x:0,z:0},everSeen:false,beliefRooms:new Set()}); team.resetCoverage();
    const po=Object.assign({targetRoom:protect},opts.person||{}); if(typeof po.targetRoom==='string')po.targetRoom=roomByName(po.targetRoom); if(typeof po.start==='string'&&po.start!=='outside')po.start=roomByName(po.start);
    if(typeof po.startExit==='string')po.startExit=doorByName(po.startExit,true);
    person.reset(po); this.scenario.person={role:person.role,intent:person.intent,targetRoom:person.targetRoom,entry:person.entry,delay:person.delay,params:Object.assign({},person.params)};
    this.endOnGone=!!opts.endOnGone; this.ended=false;
    Object.assign(mission,{version:0,order:null,tick:0,template:'',templateKey:'',queued:null,lastSay:null,pair:'01',pairT:-9,coverT:0,lastOut:null,band:'comfort'});
    applyOrder(opts.goal||'hold',null,'auto',opts.params||{}); mission.version=0; mission.order=null;
    if(opts.grounded){ mission.status='landed'; mission.grounded=true; } else mission.grounded=false;
    say('site','Floor: '+plan.rooms.map(q=>q.name).join(', ')+'. '+(person.role==='intruder'?'An intruder is heading for the '+RM(person.targetRoom).name+'.':'A visitor is in the '+(person.room>=0&&person.room<plan.rooms.length?RM(person.room).name:'building')+'.')); },
  step(dt){ simT+=dt; person.step(dt,team.drones); team.perceive(dt);
    mission.coverT-=dt; if(mission.coverT<=0){ mission.coverT=0.25; if(mission.goal==='search'||mission.sub)team.cover(); if(mission.goal==='explore')exploreObserve(); }
    mission.planT-=dt; if(mission.planT<=0){ mission.planT=0.5; planTick(); }
    deliverRadio(); for(const d of team.drones)droneStep(d,dt); mission.truthT=(mission.truthT||0)+dt; if(mission.truthT>=0.05){ truth(mission.truthT); mission.truthT=0; } },
  order(goal,text,src,params){ return applyOrder(goal,text,src,params); },
  setGoal(goal,params){ return applyOrder(goal,null,'button',params); },
  queue(goal,text,params){ if(!GOALS[goal])return false; mission.queued={goal,text,params}; say('master','Queued next: '+GOALS[goal]+'.'); return true; }
};
if(typeof module!=='undefined')module.exports={world,simT:()=>simT,metrics,settings,team,person,mission,GOALS,talk,log,seed,rng,los,getPlan:()=>plan,
